version: "3.9"

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: reviewgraph_neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-reviewgraph123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-reviewgraph123}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reviewgraph_backend
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-reviewgraph123}
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MODELS_PATH=/app/models
      - DATA_PROCESSED_PATH=/app/data/processed
      - DATA_SAMPLE_PATH=/app/data/sample
    volumes:
      - ./models:/app/models
      - ./data/processed:/app/data/processed
      - ./data/sample:/app/data/sample
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reviewgraph_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
